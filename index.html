<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIKROTIK Monitoring</title>
    <style>
        /* Removes default browser margins and makes the body fill the screen */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden; /* Prevents scrollbars on the main page */
        }
        
        /* Makes the iframe take up the entire viewport */
        iframe {
            width: 100%;
            height: 100%;
            border: none; /* Removes the default border */
        }
    </style>
</head>
<body>
    <iframe 
        id="gas-iframe"
        src="https://script.google.com/macros/s/AKfycbwkQtauYKNeais3Yth4XZGX2QCV_c8zEICEcRF_yeE/dev" 
        width="100%" 
        height="100%" 
        style="border: none;" 
        title="Money Ko Application">
    </iframe>

    <script>
        // This is the magic script that fixes the parameters!
        // It takes the query parameters from mikrotik.jiedashboard.com and passes them to the Google Apps Script iframe
        var iframe = document.getElementById('gas-iframe');
        iframe.src = iframe.src + window.location.search;
    </script>
</body>
</html>
